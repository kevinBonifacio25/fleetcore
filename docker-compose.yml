services:
  # PostgreSQL stores the API's fleet and account records.
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-fleetcore}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - fleetcore-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-fleetcore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The API waits until PostgreSQL accepts connections before starting.
  api:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-fleetcore}
      JWT_SECRET: ${JWT_SECRET:-local_development_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      API_KEYS: ${API_KEYS:-key1,key2}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  fleetcore-data:
